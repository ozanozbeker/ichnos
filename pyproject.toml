[project]
name = "ichnos"
version = "0.1.0"
description = "Infer a DBML schema and ERD from SQL queries alone, with no database connection."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
maintainers = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
keywords = ["dbml", "erd", "schema", "sql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ozanozbeker/ichnos"
Issues = "https://github.com/ozanozbeker/ichnos/issues"
Repository = "https://github.com/ozanozbeker/ichnos"

[dependency-groups]
# The tools have no lower bound, because `uv.lock` pins each one and an upgrade moves it to the latest release.
dev = [
  "prek",
  "pytest",
  "ruff",
  "rumdl",
  "ty",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]
