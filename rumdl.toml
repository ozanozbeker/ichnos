[global]
enable = ["ALL"]
disable = [
  "MD024",  # Multiple headings with the same content
  "MD063",  # Heading text capitalization style
  "MD082",  # No content before the next heading
]
exclude = [
  # The skill files stay identical to their source repos.
  ".claude",
  # The engineering skills' setup writes these files in its own format, not one sentence per line.
  "docs/agents/",
]
respect-gitignore = true
line-length = 120

[MD013]
line-length = 0
code-blocks = false
reflow = true
reflow-mode = "sentence-per-line"
severity = "info"

[MD093]
code = false
