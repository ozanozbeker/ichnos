version: 2

updates:
  # `increase-if-necessary` leaves each `>=` floor alone and moves only `uv.lock`, so a floor rises only in a `deps:` commit.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    groups:
      uv:
        patterns: ["*"]
    # The changelog hides `chore` and `ci`, so these PRs start no release.
    commit-message:
      prefix: chore

  # dbdiagram moves to newer `@dbml/core` releases, and the DBML tests follow it (ADR 0015).
  - package-ecosystem: npm
    directory: /tests/dbml
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # `@dbml/core` and `@dbml/parse` release together, and Dependabot skips a pre-release when the pin is a release.
    groups:
      dbml:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
