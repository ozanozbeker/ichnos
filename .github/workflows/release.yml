name: Release

# PyPI's trusted publisher names this file. The release PR already passed CI, so this workflow runs no tests.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestor check reads `origin/main`.
          fetch-depth: 0
          persist-credentials: false
      # The App can tag any commit, so the workflow publishes only a tag that `main` contains.
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # uv follows setup-uv, which Dependabot bumps after the cooldown.
          version: latest-known
          # A release must not restore a cache that a pull request run could have written.
          enable-cache: false
      - run: uv build
      # The tests import the package from source, so only the wheel shows whether `py.typed` is in it.
      - run: unzip -l dist/*.whl | grep -q 'ichnos/py.typed'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment accepts `v*` tags only and waits for the maintainer's approval.
    environment:
      name: pypi
      url: https://pypi.org/p/ichnos
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The PyPA action makes PEP 740 attestations by default, and `uv publish` does not.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A rerun after a partial upload skips the files PyPI already has.
          skip-existing: true
