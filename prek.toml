default_language_version.python = "3.13"
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "91ab4bf57e58b32adf1a122681f6ebe164d081c8"  # frozen: v4.4.0

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
  "--strict",
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"  # frozen: v8.30.1

[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-added-large-files"

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12

[[repos.hooks]]
id = "actionlint"

# zizmor checks workflows for security problems, which actionlint does not check.
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "fa412071e4f5d44d44f9e365f4676f9df92456a2"  # frozen: v1.30.1

[[repos.hooks]]
id = "zizmor"

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "512fc24f32f44ab01972217aaaf3dc86ec234d53"  # frozen: v1.50.2

[[repos.hooks]]
id = "typos"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix --force-exclude"
language = "system"
types_or = ["python", "pyi", "jupyter"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format --force-exclude"
language = "system"
files = '\.(py|pyi|ipynb|md)$'
require_serial = true

[[repos.hooks]]
id = "rumdl"
name = "rumdl"
entry = "uv run rumdl check --fix"
language = "system"
files = '\.md$'
require_serial = true

[[repos.hooks]]
id = "uv-lock"
name = "uv lock --check"
entry = "uv lock --check"
language = "system"
files = '^(.*/)?(pyproject\.toml|uv\.lock)$'
pass_filenames = false

[[repos.hooks]]
id = "ty"
name = "ty"
entry = "uv run ty check"
language = "system"
types = ["python"]
pass_filenames = false
